<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#3b6ea5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="单词短文">
  <title>单词短文 · 把今天的词串成故事</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand" id="title-bar"><img class="brand-icon" src="assets/icon-portrait.png" alt="">单词短文</h1>
      <div class="topbar-btns">
        <button class="icon-btn" id="btn-history" title="历史">🕘</button>
        <button class="icon-btn" id="btn-settings" title="设置">⚙️</button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 上传区 -->
    <section class="card">
      <label class="upload-zone" id="upload-zone" for="file-input">
        <input type="file" id="file-input" accept="image/*" multiple style="display:none">
        <div class="upload-icon">🖼️</div>
        <div class="upload-text" id="upload-text">点这里，上传今天背单词的截图</div>
        <div class="upload-sub">（可从相册多选，一次传多张）</div>
      </label>
      <div class="preview hidden" id="preview-box">
        <div class="preview-grid" id="preview-grid"></div>
        <button class="btn-remove" id="btn-remove">✕ 清空重选</button>
      </div>
      <button class="btn btn-primary btn-wide" id="btn-generate" disabled>✨ 生成短文</button>
      <div class="gen-status hidden" id="gen-status"></div>
    </section>

    <!-- 结果区 -->
    <section class="card result-card hidden" id="result-card">
      <div class="result-tools">
        <span class="result-title">📜 你的短文</span>
        <button class="btn-link" id="btn-copy">复制全文</button>
      </div>
      <div class="essay" id="essay-en"></div>
      <div class="words-chip" id="words-chip"></div>
    </section>
  </main>

  <!-- 设置抽屉 -->
  <div class="drawer-mask hidden" id="settings-mask">
    <div class="drawer" id="settings-drawer">
      <div class="drawer-head">
        <span class="drawer-title">模型设置</span>
        <button class="icon-btn" id="btn-settings-close">✕</button>
      </div>
      <div class="drawer-body">
        <div class="cfg-group">
          <div class="cfg-group-title">👁 识图模型（识别截图里的单词）</div>
          <label class="field">
            <span>API 地址</span>
            <input type="url" id="cfg-vision-baseurl" placeholder="https://open.bigmodel.cn/api/paas/v4">
          </label>
          <label class="field">
            <span>模型名</span>
            <input type="text" id="cfg-vision-model" placeholder="glm-4v-flash">
          </label>
          <label class="field">
            <span>API Key</span>
            <input type="password" id="cfg-vision-key" placeholder="识图模型 key" autocomplete="off">
          </label>
        </div>
        <div class="cfg-group">
          <div class="cfg-group-title">✍️ 写文模型（生成短文 + 翻译 + 查词）</div>
          <label class="field">
            <span>API 地址</span>
            <input type="url" id="cfg-write-baseurl" placeholder="https://api.deepseek.com">
          </label>
          <label class="field">
            <span>模型名</span>
            <input type="text" id="cfg-write-model" placeholder="deepseek-chat">
          </label>
          <label class="field">
            <span>API Key</span>
            <input type="password" id="cfg-write-key" placeholder="写文模型 key" autocomplete="off">
          </label>
        </div>
        <p class="field-hint">key 只存本机、不上传。默认已帮你配好，一般不用改。</p>
        <button class="btn btn-primary" id="btn-save-cfg">保存设置</button>
        <button class="btn btn-ghost" id="btn-test">测试连接</button>
      </div>
    </div>
  </div>

  <!-- 历史抽屉 -->
  <div class="drawer-mask hidden" id="history-mask">
    <div class="drawer" id="history-drawer">
      <div class="drawer-head">
        <span class="drawer-title">历史短文</span>
        <button class="icon-btn" id="btn-history-close">✕</button>
      </div>
      <div class="drawer-body" id="history-list"></div>
    </div>
  </div>

  <!-- 查词弹窗 -->
  <div class="lookup-mask hidden" id="lookup-mask">
    <div class="lookup-pop">
      <div class="lookup-head">
        <b id="lookup-word">word</b>
        <button class="icon-btn" id="btn-lookup-close">✕</button>
      </div>
      <div class="lookup-body" id="lookup-body">查询中…</div>
      <button class="btn btn-mark" id="btn-lookup-mark">☆ 标记为生词</button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
